[project]
name = "eclipse-pt"
version = "0.1.0"
description = "Eclipses do Sol e da Lua visiveis em Portugal entre 1500 e 2499"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "shapely>=2.0",
    "contourpy>=1.2",
    "pyproj>=3.6",
]

[project.optional-dependencies]
# Auditoria independente do nucleo besseliano, a partir de efemerides JPL.
auditoria = ["skyfield>=1.49"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["pipeline"]
addopts = "-q"
